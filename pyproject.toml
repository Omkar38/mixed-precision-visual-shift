[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mixed-precision-visual-shift"
version = "0.1.0"
description = "Research implementation for mixed precision allocation under visual distribution shift"
requires-python = ">=3.11"

[project.scripts]
mpvs = "mpvs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
